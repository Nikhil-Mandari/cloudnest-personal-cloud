# ═══════════════════════════════════════════════════════════════
# CloudNest API Gateway — Local Configuration
# ═══════════════════════════════════════════════════════════════
#
# This file contains the minimum configuration required to
# connect to the central Config Server. All route definitions,
# service URLs, and feature toggles are managed remotely via
# backend/config-repo/gateway.yml.
# ═══════════════════════════════════════════════════════════════

server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Import configuration from the central Config Server ──
  # Defaults to localhost for local development; override CONFIG_SERVER_URL in Docker.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  # ── Cloud Gateway defaults ──────────────────────────────
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

  # ── Request body buffering ──────────────────────────────
  # Without raising the default (256 KB) codec limit, multipart file uploads
  # larger than 256 KB fail with DataBufferLimitException → HTTP 500 before
  # ever reaching the file-service. Must be >= spring.servlet.multipart limits.
  codec:
    max-in-memory-size: ${GATEWAY_MAX_IN_MEMORY_SIZE:100MB}

# ── Eureka Service Discovery ──────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# ── Management / Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: CloudNest API Gateway
    version: 1.0.0
    environment: development

logging:
  level:
    root: INFO
    com.cloudnest.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
