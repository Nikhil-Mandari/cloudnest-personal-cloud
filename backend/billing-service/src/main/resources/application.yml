# ═══════════════════════════════════════════════════════════════
# CloudNest Billing Service — Local Configuration
# ═══════════════════════════════════════════════════════════════
# Minimal configuration to connect to Config Server.
# All other properties are managed centrally via config-repo/billing-service.yml
# and config-repo/application.yml.
# ═══════════════════════════════════════════════════════════════

server:
  port: 8087

spring:
  application:
    name: billing-service

  # Defaults to localhost for local development; override CONFIG_SERVER_URL in Docker.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ── Eureka Service Discovery ──────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# ── Management / Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
