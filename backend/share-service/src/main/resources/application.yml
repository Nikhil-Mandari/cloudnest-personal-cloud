# ═══════════════════════════════════════════════════════════════
# CloudNest Share Service — Local Configuration
# ═══════════════════════════════════════════════════════════════
# Minimal configuration to connect to Config Server.
# All other properties are managed centrally via config-repo/share-service.yml
# and config-repo/application.yml.
# ═══════════════════════════════════════════════════════════════

server:
  port: 8086

spring:
  application:
    name: share-service

  config:
    import: optional:configserver:http://localhost:8888

# ── Eureka Service Discovery ──────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# ── Management / Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: CloudNest Share Service
    version: 1.0.0
    environment: development

# ── SpringDoc OpenAPI / Swagger UI ────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cloudnest.share: DEBUG
