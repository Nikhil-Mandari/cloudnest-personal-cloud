# ═══════════════════════════════════════════════════════════════
# CloudNest Auth Service — Test Configuration
# ═══════════════════════════════════════════════════════════════
# Shadows the main application.yml on the test classpath so that
# `mvn test` runs fully offline:
#   - H2 in-memory database (MySQL compatibility mode for the
#     LONGBLOB/TEXT column definitions used by the entities)
#   - test-only JWT secret (never a production value)
#   - no Config Server, no Eureka, no SMTP, no OAuth credentials
# ═══════════════════════════════════════════════════════════════

server:
  port: 0

spring:
  application:
    name: auth-service

  # Do not contact the Config Server during tests.
  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:h2:mem:authdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: ""

# ── Eureka: do not register or fetch during tests ─────────────
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# ── JWT: strong test-only secret (SHA-256-derived, ≥32 chars) ─
jwt:
  secret: ${JWT_SECRET:test-only-secret-for-auth-service-context-loads-please-change-1234567890}
  expiration-ms: 86400000

# ── Transactional email: dev mode (OTP returned as devOtp) ────
app:
  mail:
    from: noreply@cloudnest.app
    enabled: false

management:
  health:
    mail:
      enabled: false
