spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          # Defaults to ../config-repo when running locally from backend/config-server.
          # In Docker, CONFIG_REPO_LOCATION points to the mounted /app/config-repo directory.
          search-locations: file:${CONFIG_REPO_LOCATION:../config-repo}

server:
  port: 8888

eureka:
  instance:
    # Register with the container IP (required for Docker: hostname is an unresolvable container ID)
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"