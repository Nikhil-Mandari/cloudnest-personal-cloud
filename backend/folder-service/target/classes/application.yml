# ═══════════════════════════════════════════════════════════════
# CloudNest Folder Service — Local Configuration
# ═══════════════════════════════════════════════════════════════
# Minimal configuration to connect to Config Server.
# All other properties are managed centrally via config-repo/folder-service.yml
# and config-repo/application.yml.
# ═══════════════════════════════════════════════════════════════

server:
  port: 8084

spring:
  application:
    name: folder-service

  # Defaults to localhost for local development; override CONFIG_SERVER_URL in Docker.
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# ── Eureka Service Discovery ──────────────────────────────
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# ── Management / Actuator ─────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: CloudNest Folder Service
    version: 1.0.0
    environment: development

# ── SpringDoc OpenAPI / Swagger UI ────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cloudnest.folder: DEBUG
