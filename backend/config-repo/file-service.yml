server:
  port: 8083

spring:
  application:
    name: file-service

  datasource:
    url: ${FILE_DB_URL:jdbc:mysql://localhost:3306/file_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${FILE_DB_USERNAME:root}
    password: ${FILE_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ── MinIO Object Storage Configuration ──────────────────────
# Binary file content lives in MinIO; metadata lives in MySQL.
# Credentials are supplied via environment variables (see docker-compose.yml).
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:cloudnest-files}
  secure: ${MINIO_SECURE:false}
  max-file-size: ${MINIO_MAX_FILE_SIZE:104857600}  # 100 MB

eureka:
  instance:
    # Register with the container IP (required for Docker: hostname is an unresolvable container ID)
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
