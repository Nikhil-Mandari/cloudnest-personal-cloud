app:
  name: CloudNest
  version: 1.0.0
  description: Personal Cloud Storage Platform

company:
  name: CloudNest Technologies

environment: development

# ── Global JWT Configuration ──────────────────────────────────
# Used by API Gateway (validation) and Auth Service (generation)
jwt:
  secret: "${JWT_SECRET:YnVnZmF0YWxzbm93bGVvcGFyZHN0cmV0Y2hpbmdvbmV0d29zbm93ZmFsbGluZ3RocmVlc2ZhbGxpbmc="
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours default

# ── Global Datasource Defaults ───────────────────────────────
spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ${app.name}
    version: ${app.version}
    environment: ${environment}
