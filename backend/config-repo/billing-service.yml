server:
  port: 8087

spring:
  application:
    name: billing-service

  datasource:
    url: ${BILLING_DB_URL:jdbc:mysql://localhost:3306/billing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${BILLING_DB_USERNAME:root}
    password: ${BILLING_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  instance:
    # Register with the container IP (required for Docker: hostname is an unresolvable container ID)
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# ── Razorpay Payment Provider ──────────────────────────────────
# Credentials are supplied ONLY through environment variables and are
# never committed. When RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET are absent
# the gateway is disabled: order creation returns 503 "payment provider
# not configured" instead of faking a successful payment.
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  enabled: ${RAZORPAY_ENABLED:false}

# Payment orders older than this many minutes are expired automatically.
billing:
  order-expiry-minutes: ${BILLING_ORDER_EXPIRY_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
