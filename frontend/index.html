<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CloudNest — Your personal cloud. Your files. Anywhere." />
    <meta name="theme-color" content="#4f46e5" />
    <title>CloudNest — Personal Cloud</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the persisted theme before React mounts to avoid a flash of the
      // wrong theme. The storage key must stay in sync with STORAGE_KEYS.theme
      // in src/constants/storage.ts (zustand persist payload: { state: {...} }).
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('cloudnest-theme') || 'null');
          var theme = stored && stored.state && stored.state.theme ? stored.state.theme : 'light';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore corrupt storage */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
