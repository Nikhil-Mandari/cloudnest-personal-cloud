    <script>
      // Apply the persisted theme before React mounts to avoid a flash of the
      // wrong theme. The storage key must stay in sync with STORAGE_KEYS.theme
      // in src/constants/storage.ts (zustand persist payload: { state: {...} }).
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem('cloudnest-theme') || 'null');
          var theme = stored && stored.state && stored.state.theme ? stored.state.theme : 'light';
          var dark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* ignore corrupt storage */
        }
      })();
    </script>
